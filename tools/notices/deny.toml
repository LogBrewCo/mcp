[graph]
all-features = true

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
workspace-default-features = "deny"
external-default-features = "deny"
skip = [{ crate = "syn@2.0.119", reason = "scroll_derive 0.13.1 requires syn 2 while serde_derive 1.0.229 requires syn 3" }]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]
scope = "workspace"
level = "deny"
rust-version = "1.99"

