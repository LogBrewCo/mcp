allow-comparison-to-zero = false
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
check-private-items = true
# Check metadata while crates.io publication is disabled.
cargo-ignore-publish = true
# scroll_derive 0.13.1 requires syn 2; serde_derive 1.0.229 requires syn 3.
# deny.toml constrains the extra version and features.
# Reviewed 2026-10-04; review by 2026-11-04 or before a lockfile change.
# https://rust-lang.github.io/rust-clippy/rust-1.99.0/index.html#multiple_crate_versions
allowed-duplicate-crates = ["syn"]
excessive-nesting-threshold = 3
