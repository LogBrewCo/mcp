name: Advisories

# Scans the locked dependencies every day, so an advisory published after a
# change merged still fails within 24 hours. A failed scan opens or updates the
# issue "Dependency advisories" and fails the run; a clean scan closes it
# (scripts/advisory-issue.sh).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  scan:
    name: Scan locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.scan.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-deny
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256sum -c - <<'SUMS'
          9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          SUMS
          tar -xzf cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C "$bin" cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Scan with cargo deny
        id: scan
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/advisories.txt"
          status=0
          cargo deny --locked check --deny warnings advisories >"$report" 2>&1 || status=$?
          cat "$report"
          delimiter="report_$RANDOM$RANDOM"
          { echo "report<<$delimiter"; tail -c 60000 "$report"; echo; echo "$delimiter"; } >>"$GITHUB_OUTPUT"
          exit "$status"

  report:
    name: Open, update, or close the advisory issue
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/advisory-issue.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.scan.outputs.report }}
          RESULT: ${{ needs.scan.result }}
        run: |
          printf '%s\n' "$REPORT" >"$RUNNER_TEMP/advisories.txt"
          bash scripts/advisory-issue.sh "$RESULT" "$RUNNER_TEMP/advisories.txt"
