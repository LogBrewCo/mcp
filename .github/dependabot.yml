# Dependabot checks every ecosystem daily and opens one grouped pull request per
# ecosystem. It waits 7 days after a release, so a release that its publisher
# pulls or replaces within a week never lands. Security updates do not wait.
# scripts/check-dependabot.sh fails when a tracked manifest has no entry here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The v2.6.0 image index points at manifests that ghcr.io no longer
      # serves, so the job cannot pull it: ossf/scorecard-action#1752.
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
  - package-ecosystem: rust-toolchain
    directories:
      - /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      rust-toolchain:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /.clusterfuzzlite
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
