[package]
name = "logbrew-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Authenticated LogBrew Model Context Protocol server"
readme = "README.md"
repository = "https://github.com/LogBrewCo/mcp"
license = "Apache-2.0"
keywords = ["mcp", "logbrew", "observability"]
categories = ["development-tools"]
publish = false

[package.metadata.quality-tools]
cargo-deny = "=0.20.2"

[dependencies]
axum = "=0.8.9"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
base64 = "=0.23.1"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
jsonschema = { version = "=0.58.5", default-features = false, features = ["arbitrary-precision"] }
mime = "=0.3.17"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rustix = { version = "=1.1.5", features = ["fs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower-service = "=0.3.3"
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = "=0.14.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "form"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
rustix = { version = "=1.1.5", features = ["process"] }
tokio = { version = "=1.53.1", features = ["io-util"] }
tokio-rustls = "=0.26.6"
tower = { version = "=0.5.3", features = ["util"] }

[lints.clippy]
all = { level = "deny", priority = -3 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
cargo = { level = "deny", priority = -4 }
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
cognitive_complexity = "deny"
create_dir = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
definition_in_module_root = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
else_if_without_else = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
float_arithmetic = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
inline_asm_x86_att_syntax = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
modulo_arithmetic = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "deny"
non_ascii_literal = "deny"
non_zero_suggestions = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
panic_in_result_fn = "deny"
pathbuf_init_then_push = "deny"
pedantic = { level = "deny", priority = -2 }
pointer_format = "deny"
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
rest_pattern_accessible_field = "deny"
return_and_then = "deny"
same_name_method = "deny"
semicolon_inside_block = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_rest_pattern = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[lints.rust]
let_underscore_drop = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unused_results = "deny"
warnings = "deny"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.test]
debug = 0
