[[tool]]
id = "tombi"
risk = "TOML formatting and schema errors in manifests and configuration"
tool = "Tombi CLI (native Rust)"
version = "1.11.3"
pins = ["scripts/check-all.sh::require_version tombi \"tombi @VERSION@\"", ".github/workflows/ci.yml::36672279d05f093455f01fa5a2799a8cc2162a9195cbbb23f0f8d1107d0de497  tombi-cli-@VERSION@-x86_64-unknown-linux-musl.tar.gz"]
