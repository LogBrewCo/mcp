[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "rmcp requires chrono for its model types and schemars chrono04 feature; no rmcp release drops it yet" },
]

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
workspace-default-features = "deny"
external-default-features = "deny"
skip = [
  { crate = "getrandom:0.2", reason = "ring 0.17 requires the 0.2 API for test certificate generation" },
  { crate = "getrandom:0.3", reason = "schema validation requires the 0.3 API while rmcp and build tooling use 0.4" },
  { crate = "r-efi:5", reason = "getrandom 0.3 requires this platform binding version" },
  { crate = "syn:2", reason = "upstream macros require both the 2.x and 3.x APIs" },
  { crate = "windows-sys:0.52", reason = "ring's platform bindings use the 0.52 API" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]
scope = "workspace"
level = "deny"
rust-version = "1.99"

