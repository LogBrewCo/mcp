# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); scripts/check-all.sh runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-09-19 on ubuntu-latest.
# Every run starts from an empty runner, so pushes and pull requests are both cold.
# p99 needs 100 runs; below that an entry gives the run count and the maximum.
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment).

gates = ["scripts/check-all.sh"]
utilities = ["[[", "cat", "cd", "curl", "dirname", "echo", "exit", "export", "git", "local", "mkdir", "printf", "read", "set", "sha256sum", "tail", "tar"]

[[tool]]
id = "cargo-deny"
risk = "dependency advisories, licenses, bans, duplicate versions, and sources, on every change and again each day for advisories published after a change merged"
tool = "cargo-deny, and scripts/advisory-issue.sh for the daily scan"
version = "0.20.2"
pins = ["scripts/check-all.sh::require_version cargo-deny \"cargo-deny @VERSION@\"", ".github/workflows/ci.yml::9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-@VERSION@-x86_64-unknown-linux-musl.tar.gz", ".github/workflows/advisories.yml::9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-@VERSION@-x86_64-unknown-linux-musl.tar.gz"]
commands = ["cargo deny", "scripts/advisory-issue.sh"]
runs_in = "CI check job (scripts/check-all.sh) on every pull request and push; Advisories workflow every day at 05:17 UTC and on manual runs (opens, updates, or closes the issue \"Dependency advisories\")"
config = "deny.toml; CI: cargo deny --locked check --deny warnings advisories bans licenses sources; Advisories: cargo deny --locked check --deny warnings advisories"
conflicts = "none known"
exceptions = "deny.toml ignores RUSTSEC-2026-0543 (chrono through rmcp) until an rmcp release drops chrono; deny.toml lists 5 duplicate-version skips and 1 license exception, each with its reason"
runtime = "inside the check step (see rust); installing all pinned tools takes at most 2 s (n=31)"
findings = "seeded 2026-11-19: with the RUSTSEC-2026-0543 ignore removed, the check job command fails with that advisory; seeded 2026-10-25: a throwaway branch pinning base64 0.5.1 failed with RUSTSEC-2017-0004 and opened issue #30 (run 40185029251; branch deleted); before #28 main carried RUSTSEC-2026-0346 to -0349 (rustls 0.23.45) and RUSTSEC-2026-0386 (tokio 1.53.2), which the check job never checked"
replaces = "none"
checked = 2026-11-19

